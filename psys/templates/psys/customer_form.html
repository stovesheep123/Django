<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>CYBER-SYS // 得意先登録</title>
    <style>
        body { background-color: #0b0f19; color: #00f0ff; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 40px; }
        h1 { color: #00f0ff; text-shadow: 0 0 10px rgba(0,240,255,0.5); }
        .container { background: rgba(16, 23, 42, 0.7); border: 1px solid #1e293b; border-radius: 12px; padding: 30px; box-shadow: 0 0 20px rgba(0, 240, 255, 0.1); max-width: 600px; margin: auto; backdrop-filter: blur(10px); }
        .navbar { display: flex; gap: 15px; margin-bottom: 25px; border-bottom: 1px solid #1e293b; padding-bottom: 15px; }
        .navbar a { color: #94a3b8; text-decoration: none; font-weight: bold; transition: 0.2s; }
        .navbar a.active, .navbar a:hover { color: #00f0ff; text-shadow: 0 0 8px #00f0ff; }
        p { margin-bottom: 15px; }
        label { color: #38bdf8; font-size: 0.9rem; }
        input[type="text"], input[type="number"] { background: #020617; border: 1px solid #00f0ff; color: #fff; padding: 10px; border-radius: 6px; width: 100%; box-sizing: border-box; outline: none; margin-top: 5px; box-shadow: 0 0 5px rgba(0,240,255,0.1); }
        button[type="submit"] { background: linear-gradient(135deg, #00f0ff, #0077ff); border: none; color: #020617; font-weight: bold; padding: 12px 20px; border-radius: 6px; cursor: pointer; width: 100%; box-shadow: 0 0 10px rgba(0,240,255,0.4); transition: 0.3s; margin-top: 10px; }
        button[type="submit"]:hover { opacity: 0.8; box-shadow: 0 0 20px rgba(0,240,255,0.8); }
        .error { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #f87171; padding: 10px; border-radius: 6px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="navbar">
            <a href="{% url 'customer_search' %}">[ 検索 ]</a>
            <a href="{% url 'customer_list' %}">[ 一覧 ]</a>
            <a href="{% url 'customer_create' %}" class="active">[ 新規登録 ]</a>
        </div>

        <h1>[ SYSTEM : CUSTOMER ENTRY ]</h1>

        {% if error_message %}
            <div class="error">{{ error_message }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <p>
                <label>得意先コード (例: RA0016):</label><br>
                <input type="text" name="customer_code" required maxlength="6">
            </p>
            <p>
                <label>得意先名:</label><br>
                <input type="text" name="customer_name" required maxlength="32">
            </p>
            <p>
                <label>電話番号:</label><br>
                <input type="text" name="customer_telno" maxlength="13">
            </p>
            <p>
                <label>郵便番号:</label><br>
                <input type="text" name="customer_postalcode" maxlength="8">
            </p>
            <p>
                <label>住所:</label><br>
                <input type="text" name="customer_address" maxlength="40">
            </p>
            <p>
                <label>割引率 (%):</label><br>
                <input type="number" name="discount_rate" value="0">
            </p>
            <button type="submit">REGISTER DATA</button>
        </form>
    </div>
</body>
</html>
