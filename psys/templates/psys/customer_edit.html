<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>CYBER-SYS // 得意先編集</title>
    <style>
        body { background-color: #0b0f19; color: #00f0ff; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 40px; }
        h1 { color: #00f0ff; text-shadow: 0 0 10px rgba(0,240,255,0.5); }
        .container { background: rgba(16, 23, 42, 0.7); border: 1px solid #1e293b; border-radius: 12px; padding: 30px; box-shadow: 0 0 20px rgba(0, 240, 255, 0.1); max-width: 600px; margin: auto; backdrop-filter: blur(10px); }
        p { margin-bottom: 15px; }
        label { color: #38bdf8; font-size: 0.9rem; }
        input[type="text"], input[type="number"] { background: #020617; border: 1px solid #00f0ff; color: #fff; padding: 10px; border-radius: 6px; width: 100%; box-sizing: border-box; outline: none; margin-top: 5px; box-shadow: 0 0 5px rgba(0,240,255,0.1); }
        input:disabled { background: #0f172a; border-color: #334155; color: #64748b; }
        button[type="submit"] { background: linear-gradient(135deg, #00f0ff, #0077ff); border: none; color: #020617; font-weight: bold; padding: 12px 20px; border-radius: 6px; cursor: pointer; width: 100%; box-shadow: 0 0 10px rgba(0,240,255,0.4); transition: 0.3s; margin-top: 10px; }
        button[type="submit"]:hover { opacity: 0.8; box-shadow: 0 0 20px rgba(0,240,255,0.8); }
        a { color: #38bdf8; text-decoration: none; display: inline-block; margin-top: 20px; }
        a:hover { text-shadow: 0 0 8px #38bdf8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>[ SYSTEM : CUSTOMER EDIT ]</h1>

        <form method="post">
            {% csrf_token %}
            <p>
                <label>得意先コード (変更不可):</label><br>
                <input type="text" value="{{ customer.customer_code }}" disabled>
            </p>
            <p>
                <label>得意先名:</label><br>
                <input type="text" name="customer_name" value="{{ customer.customer_name }}" required maxlength="32">
            </p>
            <p>
                <label>電話番号:</label><br>
                <input type="text" name="customer_telno" value="{{ customer.customer_telno }}" maxlength="13">
            </p>
            <p>
                <label>郵便番号:</label><br>
                <input type="text" name="customer_postalcode" value="{{ customer.customer_postalcode }}" maxlength="8">
            </p>
            <p>
                <label>住所:</label><br>
                <input type="text" name="customer_address" value="{{ customer.customer_address }}" maxlength="40">
            </p>
            <p>
                <label>割引率 (%):</label><br>
                <input type="number" name="discount_rate" value="{{ customer.discount_rate }}">
            </p>
            <button type="submit">UPDATE DATA</button>
        </form>

        <br>
        <a href="{% url 'customer_list' %}">&lt;&lt; 一覧画面へ戻る</a>
    </div>
</body>
</html>
