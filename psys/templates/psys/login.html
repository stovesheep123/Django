<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>CYBER-SYS // ログイン認証</title>
    <style>
        body { background-color: #0b0f19; color: #00f0ff; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 40px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: rgba(16, 23, 42, 0.7); border: 1px solid #1e293b; border-radius: 12px; padding: 30px; box-shadow: 0 0 20px rgba(0, 240, 255, 0.1); width: 100%; max-width: 400px; backdrop-filter: blur(10px); }
        h1 { color: #00f0ff; text-shadow: 0 0 10px rgba(0,240,255,0.5); text-align: center; font-size: 1.5rem; margin-bottom: 25px; }
        p { margin-bottom: 15px; }
        label { color: #38bdf8; font-size: 0.9rem; }
        input[type="text"], input[type="password"] { background: #020617; border: 1px solid #00f0ff; color: #fff; padding: 10px; border-radius: 6px; width: 100%; box-sizing: border-box; outline: none; margin-top: 5px; box-shadow: 0 0 5px rgba(0,240,255,0.1); }
        button[type="submit"] { background: linear-gradient(135deg, #00f0ff, #0077ff); border: none; color: #020617; font-weight: bold; padding: 12px 20px; border-radius: 6px; cursor: pointer; width: 100%; box-shadow: 0 0 10px rgba(0,240,255,0.4); transition: 0.3s; margin-top: 10px; }
        button[type="submit"]:hover { opacity: 0.8; box-shadow: 0 0 20px rgba(0,240,255,0.8); }
        .errorlist { color: #f87171; list-style: none; padding: 0; font-size: 0.85rem; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>[ AUTHENTICATION REQUIRED ]</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <p>
                <label>ユーザー名:</label><br>
                {{ form.username }}
            </p>
            <p>
                <label>パスワード:</label><br>
                {{ form.password }}
            </p>
            <button type="submit">ACCESS SYSTEM</button>
        </form>
    </div>
</body>
</html>
